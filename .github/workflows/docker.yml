# ===========================================================================
# Build the Snag Docker image and push it to GitHub Container Registry (GHCR)
# on every push to main and on version tags.
#
# Result: a prebuilt, ready-to-launch image at
#     ghcr.io/drbiobit/snag:latest
#     ghcr.io/drbiobit/snag:<git-sha>
#     ghcr.io/drbiobit/snag:vX.Y.Z   (when a v* tag is pushed)
#
# Users then just run:
#     docker pull ghcr.io/drbiobit/snag:latest
#     docker run -d -p 8000:8000 -v snag-data:/data ghcr.io/drbiobit/snag:latest
#
# No secrets are required: GITHUB_TOKEN is provided automatically by Actions
# and has permission to push to GHCR (see `permissions:` below). Make sure
# the package visibility is set to Public in the repo Settings -> Packages.
# ===========================================================================

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Allow building on demand from the Actions tab.
  workflow_dispatch:

# `packages: write` is what lets the auto-provided GITHUB_TOKEN push to GHCR.
permissions:
  contents: read
  packages: write

env:
  # Public GHCR images are pulled without a username, so we tag with the
  # lowercase owner/repo. (GHCR requires lowercase image names.)
  GHCR_IMAGE: ghcr.io/drbiobit/snag

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # buildx is required for the GHA build cache below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR using the token Actions gives us for free.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the tag list first. We always tag `latest` and the exact
      # commit sha; on a v* tag push we also add the version tag. Building
      # the list in bash (instead of a YAML ternary) avoids emitting an
      # invalid empty "image:" tag on non-tag pushes.
      - name: Compute image tags
        id: tags
        run: |
          {
            echo "${{ env.GHCR_IMAGE }}:latest"
            echo "${{ env.GHCR_IMAGE }}:${GITHUB_SHA}"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "${{ env.GHCR_IMAGE }}:${GITHUB_REF_NAME}"
            fi
          } > tags.txt
          # Multi-line step output via a heredoc delimiter.
          {
            echo "tags<<TAGS_EOF"
            cat tags.txt
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Build and push with the computed tags.
      #
      # `platforms` builds a multi-arch image so it runs natively on both
      # Intel (amd64) and Apple Silicon / ARM (arm64) machines. buildx
      # cross-compiles the apt/pip layers for each arch; the pure-Python app
      # code is arch-independent so this is safe.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          # Reuse layers between runs to keep builds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
