# ===========================================================================
# Snag - Docker Compose (deployment)
#
# This deploys the `snag` image. Build the image first (from the project
# root), then run compose:
#
#     docker build -t snag .                 # build the image
#     docker compose -f docker/docker-compose.yml up -d   # deploy it
#
# Open http://localhost:8000
# ===========================================================================

services:
  snag:
    image: snag:latest           # built by `docker build -t snag .`
    container_name: snag
    ports:
      - "8000:8000"               # host:container (change left side to remap)
    environment:
      # Where downloaded media files are stored (mounted below).
      DOWNLOAD_DIR: /data
      # Where the SQLite auth database (snag.db) lives (mounted below).
      SNAG_CONFIG_DIR: /config
      # Must stay 1: job state is in process memory, so multiple workers
      # would break /api/status and /api/cancel polling.
      GUNICORN_WORKERS: "1"
      # Authentication: set both to enable login. Leave unset to use the
      # in-browser first-visit setup instead (credentials stored in /config).
      # SNAG_USER: admin
      # SNAG_PASSWORD: change-me
    volumes:
      # Persist downloads across container rebuilds / restarts.
      - snag-data:/data
      # Persist the auth database (users + session secret) across rebuilds.
      - snag-config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  snag-data:
  snag-config:
