<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snag · downloads</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="layout">

        <!-- Top header: app name + nav (nav lives here on every size) -->
        <header class="topbar">
            <a class="brand" href="/">
                <span>snag<span class="caret">_</span></span>
            </a>
            <nav class="side-nav" aria-label="main">
                <a href="/" data-label="app" title="app" aria-label="app">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5M9 20v-6h6v6"/></svg>
                </a>
                <a href="/downloads" class="active" data-label="downloads" title="downloads" aria-label="downloads" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>
                </a>
                <a href="/history" data-label="history" title="history" aria-label="history">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4l3 3M3.05 11a9 9 0 1 1 .5 4M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.75L3 8"/></svg>
                </a>
                <a href="/summarize" data-label="summarize" title="summarize" aria-label="summarize">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
                </a>
                <a href="/docs" data-label="docs" title="docs" aria-label="docs">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 9h8M8 13h8M8 17h5"/></svg>
                </a>
                <a href="/settings" data-label="settings" title="settings" aria-label="settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
                </a>
            </nav>
        </header>

        <!-- Body: content only (nav moved to the top header) -->
        <div class="body-row">

        <!-- Main content column -->
        <div class="content">

        <main>
            <section class="card">
                <div class="card-head">
                    <h2>Downloads</h2>
                    <span class="muted" id="dl-count">0 files</span>
                </div>

                <div id="dl-list">
                    <!-- rows injected by downloads.js -->
                    <p class="muted" id="dl-empty">No downloads yet. Grab something from the app.</p>
                </div>
            </section>
        </main>

        <footer>
            <span>snag — powered by <a href="https://github.com/yt-dlp/yt-dlp" target="_blank">yt-dlp</a></span>
        </footer>

        </div><!-- /.content -->
        </div><!-- /.body-row -->
    </div><!-- /.layout -->
    <script src="/static/downloads.js"></script>
</body>
</html>
